# Field mapping for i14-264401.nxs
# Merlin detector, 41x41 scan, 12 keV

frames:
  path: /entry/merlin_addetector/data
  keep_array: true

beam_energy:
  path: /entry/instrument/DCM/dcm_energy
  default: 12.0

# Detector distance not stored in file — typical I14 Merlin position
detector_distance:
  value: 2000.0           # mm

# Merlin pixel size 55 µm → metres
pixel_size:
  value: 55.0
  transform: um_to_m

# Scan step inferred from position arrays (stored in mm) → metres
scan_step_x:
  path: /entry/merlin_addetector/SampleX_value_set
  transform: step_from_positions_mm

scan_step_y:
  path: /entry/merlin_addetector/SampleY_value_set
  transform: step_from_positions_mm
